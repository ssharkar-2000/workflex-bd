name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma generate reads the datasource block; it never connects here.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The db:* scripts load the root .env via dotenv-cli, so CI needs one.
      - name: Write .env
        run: echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env

      # Catches a migration that is committed but does not actually apply —
      # the failure mode that otherwise only shows up during a deploy.
      - name: Apply migrations
        run: npm run db:deploy -w @workflex/api
