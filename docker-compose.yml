version: '3.8'

services:
  postgres:
    # postgis image, not plain postgres — job search is geo-first ("jobs within 5km")
    image: postgis/postgis:16-3.4
    container_name: workflex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workflex
      POSTGRES_PASSWORD: workflex_dev_password
      POSTGRES_DB: workflex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflex -d workflex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: workflex-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for KYC documents (NID / TIN / trade licence) and avatars.
  minio:
    image: minio/minio:latest
    container_name: workflex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workflex
      MINIO_ROOT_PASSWORD: workflex_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Video meetings. Development only: the dev keys below are public knowledge.
  # In production use LiveKit Cloud (or your own server) with real keys.
  livekit:
    image: livekit/livekit-server:latest
    container_name: workflex-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "devkey: secret"

volumes:
  postgres-data:
  redis-data:
  minio-data: