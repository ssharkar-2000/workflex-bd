# Render blueprint: the API, the console, and the app on the web.
#
# Create these from Render's dashboard with "New → Blueprint" pointed at this
# repository. Everything marked `sync: false` is a value Render will ask you
# for; nothing secret is written down here.
#
# The two static sites are built from the same Expo projects the phones run.
# They are the web build, not the phone app: installing on a handset is an EAS
# build, which this file does not cover.
#
# Order matters on a first deploy. The static sites bake the API's address
# into their bundle at build time, so create the API first, copy its URL, and
# put it in EXPO_PUBLIC_API_URL below before the sites build.

services:
  # --- the API -------------------------------------------------------------
  - type: web
    name: workflex-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # The build needs the workspace root: the API imports @workflex/shared,
    # and one lockfile covers both.
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # Applies pending migrations on boot. Turn this off once more than one
      # instance runs at a time — see docker-entrypoint.sh.
      - key: RUN_MIGRATIONS
        value: true

      # Postgres. Point this at your own database; Neon works, and so does a
      # Render Postgres instance.
      - key: DATABASE_URL
        sync: false

      # Which browser origins may call this API. Comma separated, no spaces.
      # Fill in once the two static sites below have their addresses:
      #   https://workflex-console.onrender.com,https://workflex-web.onrender.com
      - key: APP_WEB_ORIGINS
        sync: false

      # Tokens. Generate fresh values; never reuse the ones from development.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      # Only addresses on this domain may hold an admin account.
      - key: ADMIN_EMAIL_DOMAIN
        sync: false

      # This API as the outside world reaches it, ending in /api/v1.
      - key: API_PUBLIC_URL
        sync: false

      # --- payments ---
      # off until you have merchant credentials. The simulator refuses to
      # start in production, by design.
      - key: PAYMENT_PROVIDER
        value: 'off'
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: SSLCOMMERZ_SANDBOX
        value: 'false'

      # --- the wallet's own receiving accounts ---
      - key: WALLET_DEPOSIT_BKASH
        sync: false
      - key: WALLET_DEPOSIT_NAGAD
        sync: false
      - key: WALLET_DEPOSIT_NAME
        sync: false
      # Must stay false in production: the API refuses to start otherwise.
      - key: WALLET_AUTO_APPROVE_DEPOSITS
        value: 'false'

      # --- outbound messages ---
      #
      # There is no "off" here, and production refuses the file and console
      # providers: an OTP written to a log has not been delivered, and an app
      # that cannot send one cannot sign anybody in. The API will not boot
      # until these two are filled, which is deliberate.
      - key: SMS_PROVIDER
        value: bulksmsbd
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false

      # Email: verification and receipts. 'resend' needs RESEND_API_KEY,
      # 'smtp' needs host, user and password.
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # --- document storage ---
      #
      # A container's own disk is wiped on every deploy, so uploaded NIDs and
      # trade licences have to live in object storage rather than STORAGE_DIR.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_DOCUMENTS
        sync: false

      # --- Google Meet (optional) ---
      # Leave blank and video interviews use Jitsi rooms. To turn it on,
      # register https://<this-api>/api/v1/google/callback as a redirect URI
      # on the Google OAuth client, and set GOOGLE_REDIRECT_URI to the same.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # --- AI ---
      - key: CV_PARSER
        value: 'off'
      - key: ANTHROPIC_API_KEY
        sync: false

  # --- the admin console ---------------------------------------------------
  - type: web
    name: workflex-console
    runtime: static
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    buildCommand: >-
      npm ci &&
      npm run build --workspace @workflex/shared &&
      npm run build:web --workspace @workflex/admin
    staticPublishPath: ./apps/admin/dist
    envVars:
      # The console talks to the API under its own prefix. Set this to the
      # API service's address with /api/v1/console on the end.
      - key: EXPO_PUBLIC_API_URL
        sync: false
    routes:
      # Expo Router exports one HTML file and routes in the browser, so every
      # path has to be served that file or a refresh on /workers 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # --- the worker app, on the web -----------------------------------------
  - type: web
    name: workflex-web
    runtime: static
    plan: starter
    region: singapore
    autoDeployTrigger: commit
    buildCommand: >-
      npm ci &&
      npm run build --workspace @workflex/shared &&
      npm run build:web --workspace @workflex/mobile
    staticPublishPath: ./apps/mobile/dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
