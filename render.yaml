# Render Blueprint: the whole of WorkFlex BD on free plans.
#
#   workflex-bd-api    the API (NestJS + Prisma)   https://workflex-bd-api.onrender.com
#   workflex-bd        the user app, on the web    https://workflex-bd.onrender.com
#   workflex-bd-admin  the admin console           https://workflex-bd-admin.onrender.com
#
# Render → New → Blueprint → this repository → branch `shotorupa`. Render asks
# for the values marked `sync: false`; nothing secret is written down here.
#
# The addresses are fixed on purpose. The two web apps have the API's
# address built into them, and the API only answers browsers from those two
# origins, so all three names have to be known before anything is built. If
# Render ever reports one of the names as taken, it adds a suffix — change
# the three addresses below to match and push again.
#
# Everything here is on a free plan. What that costs in behaviour:
#   - the API sleeps after 15 idle minutes and takes about a minute to wake;
#     a free uptime pinger on /api/v1/health/live every 10 minutes keeps it
#     awake (that endpoint never touches the database, so Neon still sleeps);
#   - its disk is wiped on every restart, so uploads go to object storage
#     (Backblaze B2's free 10 GB, or Cloudflare R2) — the API refuses to
#     start without it rather than lose people's documents.
# To move to an always-on paid instance later, pick a paid instance type in
# the API's Render settings (Settings → Instance Type). Nothing else changes.

services:
  # --- the API --------------------------------------------------------------
  - type: web
    name: workflex-bd-api
    runtime: node
    plan: free
    region: singapore # next to the Neon database in ap-southeast-1
    # Dev dependencies are needed to build (TypeScript, the Nest CLI, the
    # Prisma CLI) even though NODE_ENV is production.
    buildCommand: >-
      npm ci --include=dev &&
      npm run build --workspace @workflex/shared &&
      npm run build --workspace @workflex/api
    # Migrations run on every start: a no-op when nothing is pending, and
    # the free plan has no separate pre-deploy step to run them in.
    startCommand: >-
      npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
      node apps/api/dist/main.js
    healthCheckPath: /api/v1/health/live
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=400

      # Postgres on Neon. Paste the connection string of your production
      # branch (Neon → Branches → production → Connect).
      - key: DATABASE_URL
        sync: false

      # Fresh random values, generated by Render. Never the development ones.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true

      - key: API_PUBLIC_URL
        value: https://workflex-bd-api.onrender.com/api/v1
      # The only browser origins allowed to call the API.
      - key: APP_WEB_ORIGINS
        value: https://workflex-bd.onrender.com,https://workflex-bd-admin.onrender.com

      # --- uploads: S3-compatible object storage (required) ---
      # Backblaze B2 (free 10 GB, no card): create a private bucket and an
      # application key, then use the bucket's endpoint, e.g.
      #   S3_ENDPOINT=https://s3.us-east-005.backblazeb2.com  S3_REGION=us-east-005
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_DOCUMENTS
        sync: false

      # --- sign-up codes and email ---
      # No SMS gateway yet: codes are written to this service's log, which
      # only the account owner can read. Password sign-in is unaffected.
      # With a BulkSMSBD account, set SMS_PROVIDER=bulksmsbd plus
      # SMS_API_KEY and SMS_SENDER_ID, and delete ALLOW_OTP_IN_LOGS.
      - key: SMS_PROVIDER
        value: console
      - key: ALLOW_OTP_IN_LOGS
        value: 'true'
      - key: MAIL_PROVIDER
        value: console

      # --- money ---
      # No payment gateway: wallets, transfers and declared deposits work;
      # card/bKash top-ups stay off until SSLCommerz credentials exist.
      - key: PAYMENT_PROVIDER
        value: 'off'
      - key: WALLET_AUTO_APPROVE_DEPOSITS
        value: 'false'

      # --- AI ---
      # Off: every AI feature uses its built-in fallback. For Claude, set
      # CV_PARSER=claude and ANTHROPIC_API_KEY.
      - key: CV_PARSER
        value: 'off'

      # --- Google Meet (optional) ---
      # Leave both blank and video interviews use Jitsi rooms. To use Meet,
      # add the redirect URI below to the OAuth client in Google Cloud
      # Console, then paste the client's ID and secret here.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://workflex-bd-api.onrender.com/api/v1/google/callback

  # --- the user app, on the web ---------------------------------------------
  - type: web
    name: workflex-bd
    runtime: static
    buildCommand: >-
      npm ci --include=dev &&
      npm run build --workspace @workflex/shared &&
      npm run build:web --workspace @workflex/mobile -- --clear
    staticPublishPath: ./apps/mobile/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/mobile/**
        - packages/shared/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: EXPO_PUBLIC_API_URL
        value: https://workflex-bd-api.onrender.com/api/v1
      # Only so the API workspace's `prisma generate` step can run during
      # install; a static site never connects to a database.
      - key: DATABASE_URL
        value: postgresql://build:build@localhost:5432/build
    routes:
      # One HTML file that routes in the browser, so every path is served it
      # — otherwise a refresh on /jobs would be a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # --- the admin console -----------------------------------------------------
  - type: web
    name: workflex-bd-admin
    runtime: static
    buildCommand: >-
      npm ci --include=dev &&
      npm run build --workspace @workflex/shared &&
      npm run build:web --workspace @workflex/admin -- --clear
    staticPublishPath: ./apps/admin/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/admin/**
        - packages/shared/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: '22'
      # The console talks to the API under its own prefix.
      - key: EXPO_PUBLIC_API_URL
        value: https://workflex-bd-api.onrender.com/api/v1/console
      - key: DATABASE_URL
        value: postgresql://build:build@localhost:5432/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
